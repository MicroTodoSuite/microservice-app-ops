name: Azure DR Foundation Checks

# Checks for the Azure disaster-recovery roots under azure/environments/fprd
# (gitops specs/009-full-platform-rollout T126). iac-checks.yml runs the
# organization's gate on them (rule contracts, fmt, validate, test, tflint,
# Trivy); this workflow adds what is specific to the Azure estate.
#
# The source contract and the Infracost estimate need no cloud credential and
# run on every pull request. The refreshed plan authenticates to Azure through
# OIDC and is plan-only: nothing here can apply. It stays off until the
# maintainer sets the repository variable AZURE_DR_PLAN_ENABLED to true, after
# the DR preflight (T124) has verified the account and the federated plan
# identity exists (T132). An apply is never run from CI; it uses only a saved
# plan a maintainer approved (T127-T128).

on:
  pull_request:
    branches:
      - main
    paths:
      - 'azure/**'
      - 'tests/contract/azure-dr-foundation.sh'
      - '.terraform-version'
      - '.github/workflows/azure-dr-foundation-checks.yml'

permissions:
  contents: read

jobs:
  contract:
    name: Azure DR source contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Modules only from terraform-azure-modules by tag, the backends, the
      # absence of Key Vault secrets and static credentials: what a plan and
      # the rule contracts do not show.
      - name: Check the source contract
        run: tests/contract/azure-dr-foundation.sh

  cost:
    name: Azure DR cost estimate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # `infracost comment github` posts or updates its own comment

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check for an Infracost API key
        id: key
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          if [ -n "${INFRACOST_API_KEY}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No INFRACOST_API_KEY configured; skipping the cost estimate."
          fi

      - name: Install Infracost
        if: steps.key.outputs.present == 'true'
        uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3.0.1
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # Infracost parses the HCL with each root's committed example values, so
      # this needs no Azure credential. The authoritative figure comes from the
      # saved plans T127 attaches to the apply evidence.
      - name: Estimate every Azure DR root
        if: steps.key.outputs.present == 'true'
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/infracost"
          for root in azure/environments/fprd/*/; do
            name="$(basename "$root")"
            infracost breakdown \
              --path "$root" \
              --terraform-var-file fprd.tfvars.example \
              --format json \
              --out-file "${RUNNER_TEMP}/infracost/${name}.json"
          done
          infracost output --path "${RUNNER_TEMP}/infracost/*.json" --format table

      - name: Comment the cost estimate on the pull request
        if: steps.key.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          infracost comment github \
            --path "${RUNNER_TEMP}/infracost/*.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --pull-request "${PR_NUMBER}" \
            --github-token "${GITHUB_TOKEN}" \
            --behavior update

  plan:
    name: Azure DR plan ${{ matrix.domain }} (OIDC, plan only)
    runs-on: ubuntu-latest
    needs: [contract]
    # Off until the maintainer enables it after T124 and T132; never for a
    # pull request from a fork, which has no access to the variables.
    if: vars.AZURE_DR_PLAN_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    # The federated plan identity trusts exactly this environment's subject.
    environment: azure-dr-plan
    concurrency:
      group: azure-dr-plan-${{ matrix.domain }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # The state root keeps local state and is planned by the operator only;
      # the others read their predecessors' resources by name, in this order.
      max-parallel: 1
      matrix:
        domain: [networking, registry, security, workload, security-federation]

    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_CLI: 'false'
      ARM_CLIENT_ID: ${{ vars.AZURE_DR_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: 'true'
      ROOT: azure/environments/fprd/${{ matrix.domain }}
      DOMAIN: ${{ matrix.domain }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      # Non-secret configuration from repository variables (MTS-IAC-106). The
      # backend file is the committed example, so a plan can never read another
      # root's state; AZURE_DR_TFVARS holds the shared fprd.tfvars.
      - name: Write the variable file
        env:
          DR_TFVARS: ${{ vars.AZURE_DR_TFVARS }}
        run: |
          set -euo pipefail
          for name in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID DR_TFVARS; do
            [ -n "${!name}" ] || { echo "FAIL: repository variable for ${name} is not set" >&2; exit 1; }
          done
          printf '%s\n' "${DR_TFVARS}" > "${RUNNER_TEMP}/fprd.tfvars"

      - name: Initialize against the Azure state backend
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-data
        run: >-
          terraform -chdir="${ROOT}" init
          -input=false
          -lockfile=readonly
          -backend-config="${DOMAIN}.azurerm.tfbackend.example"

      # A refreshed, plan-only run. The saved plan stays on the runner and is
      # never uploaded: only the summary of actions is printed.
      - name: Plan
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-data
        run: >-
          terraform -chdir="${ROOT}" plan -out="${RUNNER_TEMP}/${DOMAIN}.tfplan"
          -input=false
          -lock-timeout=5m
          -var-file="${RUNNER_TEMP}/fprd.tfvars"

      - name: Summarize the plan and refuse any destroy
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-data
        run: |
          set -euo pipefail
          terraform -chdir="${ROOT}" show -json "${RUNNER_TEMP}/${DOMAIN}.tfplan" > "${RUNNER_TEMP}/plan.json"
          jq -r '[.resource_changes[].change.actions | join("+")] | group_by(.) | map("\(.[0]): \(length)") | .[]' "${RUNNER_TEMP}/plan.json"
          destroys="$(jq '[.resource_changes[] | select(.change.actions | index("delete"))] | length' "${RUNNER_TEMP}/plan.json")"
          if [ "${destroys}" -ne 0 ]; then
            echo "FAIL: the ${DOMAIN} plan destroys or replaces ${destroys} resource(s); a human must review it (spec 009 T127)." >&2
            jq -r '.resource_changes[] | select(.change.actions | index("delete")) | .address' "${RUNNER_TEMP}/plan.json" >&2
            exit 1
          fi
          echo "PASS: the ${DOMAIN} plan destroys nothing."

      - name: Remove the saved plan
        if: always()
        run: rm -f "${RUNNER_TEMP}/${DOMAIN}.tfplan" "${RUNNER_TEMP}/plan.json" "${RUNNER_TEMP}/fprd.tfvars"
