name: Azure DR Foundation Checks

# Checks for the Azure disaster-recovery foundation (gitops
# specs/009-full-platform-rollout T126): the aks-foundation module and the
# azure/environments/dr/foundation root.
#
# The source contract, the offline terraform tests, and the Infracost estimate
# need no cloud credential and run on every pull request. The refreshed plan
# authenticates to Azure through OIDC and is plan-only: nothing here can apply.
# It stays off until the maintainer sets the repository variable
# AZURE_DR_PLAN_ENABLED to true, after the DR preflight (T124) has verified the
# account and the federated plan identity exists (T132). No job runs
# terraform apply or destroy: an apply uses only a saved plan a maintainer
# approved, run by an operator (T127-T128).

on:
  pull_request:
    branches:
      - main
    paths:
      - 'azure/**'
      - 'tests/contract/azure-dr-foundation.sh'
      - '.terraform-version'
      - '.github/workflows/azure-dr-foundation-checks.yml'

permissions:
  contents: read

jobs:
  contract:
    name: Azure DR source contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The backend, the absence of Key Vault secrets and static credentials,
      # and the provider pins: what a plan cannot show.
      - name: Check the source contract
        run: tests/contract/azure-dr-foundation.sh

  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AKS foundation module
            chdir: azure/modules/aks-foundation
            lockfile: ''
          - name: DR foundation root
            chdir: azure/environments/dr/foundation
            lockfile: '-lockfile=readonly'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform -chdir=${{ matrix.chdir }} fmt -check -recursive

      # -backend=false keeps this credential-free. The root's lock file is read
      # only, so a provider upgrade arrives as a reviewed lock-file change.
      - name: Initialize without the remote backend
        run: terraform -chdir=${{ matrix.chdir }} init -backend=false -input=false ${{ matrix.lockfile }}
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-data

      # Mock providers only: no credential, no subscription, no Azure call.
      - name: Test
        run: terraform -chdir=${{ matrix.chdir }} test
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-data

      # Terraform rejects validate on a module that declares
      # configuration_aliases, so the module is validated through its sample.
      - name: Validate the module sample
        if: matrix.chdir == 'azure/modules/aks-foundation'
        run: |
          set -euo pipefail
          terraform -chdir=azure/modules/aks-foundation/sample init -backend=false -input=false
          terraform -chdir=azure/modules/aks-foundation/sample validate
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-sample-data

  cost:
    name: Azure DR cost estimate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # `infracost comment github` posts or updates its own comment

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Prices depend on the location, which T124 verifies; until the
      # maintainer records it as AZURE_DR_LOCATION, no estimate is produced
      # rather than one priced for an empty region.
      - name: Check for an Infracost API key and the approved location
        id: key
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          AZURE_DR_LOCATION: ${{ vars.AZURE_DR_LOCATION }}
        run: |
          if [ -n "${INFRACOST_API_KEY}" ] && [ -n "${AZURE_DR_LOCATION}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No INFRACOST_API_KEY or AZURE_DR_LOCATION configured; skipping the cost estimate."
          fi

      - name: Install Infracost
        if: steps.key.outputs.present == 'true'
        uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3.0.1
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # Infracost parses the HCL with the committed example values and the
      # recorded location, so this needs no Azure credential. The authoritative figure comes from the
      # saved plan T127 attaches to the apply evidence.
      - name: Estimate the DR foundation
        if: steps.key.outputs.present == 'true'
        env:
          AZURE_DR_LOCATION: ${{ vars.AZURE_DR_LOCATION }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/infracost"
          infracost breakdown \
            --path azure/environments/dr/foundation \
            --terraform-var-file fprd.tfvars.example \
            --terraform-var "location=${AZURE_DR_LOCATION}" \
            --format json \
            --out-file "${RUNNER_TEMP}/infracost/dr-foundation.json"
          infracost output --path "${RUNNER_TEMP}/infracost/dr-foundation.json" --format table

      - name: Comment the cost estimate on the pull request
        if: steps.key.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          infracost comment github \
            --path "${RUNNER_TEMP}/infracost/dr-foundation.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --pull-request "${PR_NUMBER}" \
            --github-token "${GITHUB_TOKEN}" \
            --behavior update

  plan:
    name: Azure DR plan (OIDC, plan only)
    runs-on: ubuntu-latest
    needs: [contract, test]
    # Off until the maintainer enables it after T124 and T132; never for a
    # pull request from a fork, which has no access to the variables.
    if: vars.AZURE_DR_PLAN_ENABLED == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    # The federated plan identity trusts exactly this environment's subject.
    environment: azure-dr-plan
    concurrency:
      group: azure-dr-foundation-plan
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    env:
      ARM_USE_OIDC: 'true'
      ARM_USE_CLI: 'false'
      ARM_CLIENT_ID: ${{ vars.AZURE_DR_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: 'true'
      ROOT: azure/environments/dr/foundation

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      # Non-secret configuration from repository variables (MTS-IAC-106). The
      # state key is the committed one, so this plan can never read another
      # root's state.
      - name: Write the backend and variable files
        env:
          BACKEND_RESOURCE_GROUP: ${{ vars.AZURE_DR_BACKEND_RESOURCE_GROUP }}
          BACKEND_STORAGE_ACCOUNT: ${{ vars.AZURE_DR_BACKEND_STORAGE_ACCOUNT }}
          BACKEND_CONTAINER: ${{ vars.AZURE_DR_BACKEND_CONTAINER }}
          DR_TFVARS: ${{ vars.AZURE_DR_TFVARS }}
        run: |
          set -euo pipefail
          for name in ARM_CLIENT_ID ARM_TENANT_ID ARM_SUBSCRIPTION_ID BACKEND_RESOURCE_GROUP BACKEND_STORAGE_ACCOUNT BACKEND_CONTAINER DR_TFVARS; do
            [ -n "${!name}" ] || { echo "FAIL: repository variable for ${name} is not set" >&2; exit 1; }
          done
          key="$(sed -nE 's/^key[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "${ROOT}/foundation.azurerm.tfbackend.example")"
          [ -n "${key}" ] || { echo "FAIL: the committed backend example names no state key" >&2; exit 1; }
          {
            printf 'resource_group_name  = "%s"\n' "${BACKEND_RESOURCE_GROUP}"
            printf 'storage_account_name = "%s"\n' "${BACKEND_STORAGE_ACCOUNT}"
            printf 'container_name       = "%s"\n' "${BACKEND_CONTAINER}"
            printf 'key                  = "%s"\n' "${key}"
            printf 'use_azuread_auth     = true\n'
          } > "${RUNNER_TEMP}/foundation.azurerm.tfbackend"
          printf '%s\n' "${DR_TFVARS}" > "${RUNNER_TEMP}/fprd.tfvars"

      - name: Initialize against the Azure backend
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-data
        run: >-
          terraform -chdir="${ROOT}" init
          -input=false
          -lockfile=readonly
          -backend-config="${RUNNER_TEMP}/foundation.azurerm.tfbackend"

      # A refreshed, plan-only run. The saved plan stays on the runner and is
      # never uploaded: only the summary of actions is printed.
      - name: Plan
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-data
        run: >-
          terraform -chdir="${ROOT}" plan -out="${RUNNER_TEMP}/dr-foundation.tfplan"
          -input=false
          -lock-timeout=5m
          -var-file="${RUNNER_TEMP}/fprd.tfvars"

      - name: Summarize the plan and refuse any destroy
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-data
        run: |
          set -euo pipefail
          terraform -chdir="${ROOT}" show -json "${RUNNER_TEMP}/dr-foundation.tfplan" > "${RUNNER_TEMP}/plan.json"
          jq -r '[.resource_changes[].change.actions | join("+")] | group_by(.) | map("\(.[0]): \(length)") | .[]' "${RUNNER_TEMP}/plan.json"
          destroys="$(jq '[.resource_changes[] | select(.change.actions | index("delete"))] | length' "${RUNNER_TEMP}/plan.json")"
          if [ "${destroys}" -ne 0 ]; then
            echo "FAIL: the plan destroys or replaces ${destroys} resource(s); a human must review it (spec 009 T127)." >&2
            jq -r '.resource_changes[] | select(.change.actions | index("delete")) | .address' "${RUNNER_TEMP}/plan.json" >&2
            exit 1
          fi
          echo "PASS: the plan destroys nothing."

      - name: Remove the saved plan
        if: always()
        run: rm -f "${RUNNER_TEMP}/dr-foundation.tfplan" "${RUNNER_TEMP}/plan.json" "${RUNNER_TEMP}/fprd.tfvars"
