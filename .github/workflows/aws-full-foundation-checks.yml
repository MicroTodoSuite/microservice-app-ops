name: AWS Full Foundation Checks

# Static checks for the full-profile roots: the shared egress hub, full-dev,
# full-prod, and the demo-full staging prerequisites.
#
# Everything here runs without AWS credentials. That is a deliberate limit, not
# an oversight: a refreshed plan against the real backend is what decides whether
# an apply is safe, and those plans are produced and reviewed by a human under
# T053-T056, against an external state backup. What CI can do is prove that every
# root still parses, validates, and satisfies its own contract on every pull
# request — the checks that are worth running a hundred times a week.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'aws/**'
      - 'tests/contract/rebuilt-plan-contracts.sh'
      - 'tests/contract/fixtures/rebuilt-plans/**'
      - '.terraform-version'
      - '.github/workflows/aws-full-foundation-checks.yml'

permissions:
  contents: read

jobs:
  rebuilt-plan-contracts:
    name: Rebuilt plan contract self-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prove each plan fixture passes or fails as specified
        run: tests/contract/rebuilt-plan-contracts.sh --self-test

  validate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      # One failing root must not hide the state of the other three.
      fail-fast: false
      matrix:
        include:
          - name: Shared egress hub
            chdir: aws/shared/egress
          - name: Full dev foundation
            chdir: aws/environments/full-dev/foundation
          - name: Full prod foundation
            chdir: aws/environments/full-prod/foundation
          - name: Demo full staging prerequisites
            chdir: aws/environments/demo-full/foundation
          - name: Centralized egress module
            chdir: aws/modules/centralized-egress

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Check Terraform formatting
        run: terraform -chdir=${{ matrix.chdir }} fmt -check -recursive

      # -backend=false keeps this credential-free; -lockfile=readonly means a
      # provider upgrade has to arrive as a reviewed lockfile change rather than
      # appearing silently on the next CI run.
      - name: Initialize without the remote backend
        run: >-
          terraform -chdir=${{ matrix.chdir }} init
          -backend=false
          -input=false
          -lockfile=readonly
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-data

      - name: Validate
        run: terraform -chdir=${{ matrix.chdir }} validate
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-data

      - name: Test
        run: terraform -chdir=${{ matrix.chdir }} test
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-data

  state-keys:
    name: State keys stay distinct
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Two roots sharing a state key is the failure that destroys an
      # environment rather than reporting an error: the second apply reads the
      # first one's state and plans to delete everything it does not recognise.
      # The real backend files are gitignored, so the committed examples are what
      # can be checked here.
      - name: Every committed backend example uses a distinct key
        run: |
          set -euo pipefail
          keys=$(grep -h '^key' \
            aws/environments/*/*/*.s3.tfbackend.example \
            aws/shared/*/*.s3.tfbackend.example \
            | sed -E 's/^key[[:space:]]*=[[:space:]]*//' | tr -d '"')
          total=$(printf '%s\n' "$keys" | wc -l)
          unique=$(printf '%s\n' "$keys" | sort -u | wc -l)
          printf 'state keys:\n%s\n' "$keys"
          if [ "$total" -ne "$unique" ]; then
            echo "FAIL: two roots declare the same Terraform state key." >&2
            printf '%s\n' "$keys" | sort | uniq -d >&2
            exit 1
          fi
          echo "PASS: $unique distinct state keys."

  cost:
    name: Cost estimate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # `infracost comment github` needs this to post/update its own comment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the merge-base to diff against for "which roots changed"

      - name: Check for an Infracost API key
        id: key
        run: |
          if [ -n "${{ secrets.INFRACOST_API_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No INFRACOST_API_KEY configured; skipping the cost estimate."
          fi

      - name: Install Infracost
        if: steps.key.outputs.present == 'true'
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # A root is any directory with its own versions.tf (i.e. it is meant to
      # be `terraform init`-ed on its own, not a reusable module referenced by
      # one) that has at least one directly changed .tf file. This is every
      # Terraform root this PR actually touches, not a hand-maintained list
      # that silently misses new roots (this is exactly how the shared
      # slack-approval-gateway root went unestimated until now).
      - name: Find every Terraform root this PR actually changed
        id: roots
        if: steps.key.outputs.present == 'true'
        run: |
          set -euo pipefail
          mkdir -p /tmp/infracost
          changed_dirs="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- '*.tf' | xargs -r -n1 dirname | sort -u)"
          roots=()
          for d in $changed_dirs; do
            [[ -f "$d/versions.tf" ]] && roots+=("$d")
          done
          if [[ ${#roots[@]} -eq 0 ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No changed directory is a Terraform root; nothing to estimate."
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${roots[@]}" | tee /tmp/infracost/roots.txt
          fi

      # Infracost parses the HCL directly, so this needs no AWS credentials and
      # no saved plan. It is an estimate of the declared configuration, which is
      # what a reviewer needs on a pull request; the authoritative figure comes
      # from the saved plan attached to each apply's evidence.
      - name: Estimate every changed root
        if: steps.key.outputs.present == 'true' && steps.roots.outputs.found == 'true'
        run: |
          set -euo pipefail
          while IFS= read -r root; do
            name="$(echo "$root" | tr '/' '-')"
            echo "=== $root ==="
            infracost breakdown --path "$root" --format json --out-file "/tmp/infracost/$name.json"
          done < /tmp/infracost/roots.txt
          infracost output --path "/tmp/infracost/*.json" --format table --out-file /tmp/infracost/combined.txt
          cat /tmp/infracost/combined.txt

      - name: Comment the cost estimate on the pull request
        if: steps.key.outputs.present == 'true' && steps.roots.outputs.found == 'true'
        run: |
          set -euo pipefail
          infracost comment github \
            --path "/tmp/infracost/*.json" \
            --repo "${{ github.repository }}" \
            --pull-request "${{ github.event.pull_request.number }}" \
            --github-token "${{ secrets.GITHUB_TOKEN }}" \
            --behavior update

      # Not a GitHub webhook: this repo's own Slack approval gateway (spec:
      # microservice-app-docs/full-platform/slack-approval-gateway.md) reads
      # this directly so the reviewer sees the real cost inside the same
      # Slack message they approve from, not only as a PR comment they might
      # not open. Signed with the same secret the gateway already verifies
      # real GitHub webhooks against.
      - name: Report the cost estimate to the Slack approval gateway
        if: steps.key.outputs.present == 'true' && steps.roots.outputs.found == 'true'
        env:
          WEBHOOK_SECRET: ${{ secrets.SLACK_GATEWAY_WEBHOOK_SECRET }}
          API_BASE_URL: ${{ vars.SLACK_GATEWAY_API_BASE_URL }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          if [[ -z "${WEBHOOK_SECRET:-}" || -z "${API_BASE_URL:-}" ]]; then
            echo "SLACK_GATEWAY_WEBHOOK_SECRET or SLACK_GATEWAY_API_BASE_URL is not configured; skipping the Slack report."
            exit 0
          fi
          cost_summary="$(cat /tmp/infracost/combined.txt)"
          payload="$(jq -n \
            --arg repo "$REPO_NAME" \
            --argjson prNumber "$PR_NUMBER" \
            --arg prBody "$PR_BODY" \
            --arg costSummary "$cost_summary" \
            '{repo: $repo, prNumber: $prNumber, prBody: $prBody, costSummary: $costSummary}')"
          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')"
          curl -sf -X POST "${API_BASE_URL}/internal/cost-report" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $signature" \
            -d "$payload"
